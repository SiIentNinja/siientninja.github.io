<script>
const STORAGEKEY = "pell-editor-text";
const editor = pell.init({
  element: document.getElementById('essay'),
  onChange: html => {
    document.getElementById('foo').textContent = html;
    localStorage.setItem(STORAGEKEY, html);
  },
  actions: [],
  classes: {
    content: 'pell-content',
    actionbar: 'pell-actionbar',
  }
});

//fetch saved data if exist
const storedtext = localStorage.getItem(STORAGEKEY)
if (storedtext) {
  editor.content.innerHTML = storedtext;
}

</script>
<script>
let player;
let examplayer;
  
function onYouTubeIframeAPIReady() {
  
player = new YT.Player('yt', {
                height: '90',
                width: '160',
                videoId: '',
		playerVars: {
    		    'origin': window.location.origin,
    		    'widget_referrer': window.location.origin,
            'playsinline': 1,
            'controls': 0,
            'modestbranding': 1
  		},
                events: {
                    'onError': onPlayerError
                }
            });
            

examplayer = new YT.Player('examnoise', {
                height: '90',
                width: '160',
                videoId: 'A0iHLgaxHlU',
		playerVars: {
    		    'origin': window.location.origin,
    		    'widget_referrer': window.location.origin,
            'playsinline': 1,
            'controls': 0,
            'modestbranding': 1,
            'autoplay': 1,
            'loop': 1,
            'playlist': 'A0iHLgaxHlU'
  		},
                // events: {
                //     'onReady': onPlayerReady
                // }
            });
};

// function onPlayerReady(event) { 
//   player.playVideo() // Start play the video automatically when ready 
// }
function onPlayerError(event) {
  document.getElementById("placeholder").src = `https://placehold.co/160x90?text=Invalid+URL`;
}

if (window.YT && window.YT.Player && !player) {
  onYouTubeIframeAPIReady();
}


document.getElementById("url").addEventListener("submit", loadVideo);
  
function loadVideo(event) {
  event.preventDefault();
  let url = new URL(document.getElementById("text").value.trim());
  let videoId;
  
  if (url.hostname.endsWith("youtube.com")) {
    if (url.searchParams.has("v")) {
      videoId = url.searchParams.get("v");
    } else {
      return;
    }
  } else {
    console.log(`not youtube ${url}`);
    return;
  }
  
  player.loadVideoById(videoId);
  document.getElementById("placeholder").src = `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
}


let loop = setInterval(check, 500 / 5);
let chars;// = document.getElementById("essay").value.length;
let charchange = 0;
const hpbar = document.getElementById("bar");
let hp = 0;
let hpdisplay;
let pelldiv;

function check() {
  pelldiv = document.getElementById("essay").textContent || '';
  charchange = pelldiv.length - chars;
  chars = pelldiv.length;
  if (charchange > 0 && hp < 20) {
  hp += charchange / 3;
  }
  
  hpdisplay = Math.min(hp / 20 , 1)
  hpbar.style.height = `${hpdisplay * 100}%`;
  
  if (hp > 0) {
  hp -= document.getElementById("slider").value / 5;
  if (hp < 0) {
    hp = 0
  }
  player.playVideo();
  player.setPlaybackRate((hpdisplay * 75 + 25) / 100);
  player.setVolume(hpdisplay * 100);
  } else {
    if (player && typeof player.pauseVideo === "function") {
    player.pauseVideo();
    }
  }
  
  if (hp === 1 || !document.getElementById("exam").checked) {
    if (examplayer && typeof examplayer.pauseVideo === "function") {
    examplayer.pauseVideo();
    }
  } else {
    examplayer.playVideo();
    examplayer.setVolume((1-hpdisplay) * 100);
  }
  
}

const root = document.documentElement;
document.getElementById("darkmode").addEventListener("change", changeTheme);

function changeTheme() {
  if (document.getElementById("darkmode").checked) {
    root.style.setProperty('--text-color', 'white');
    root.style.setProperty('--background-color', 'rgb(33, 33, 33)');
    root.style.setProperty('--header-color', 'rgb(55, 89, 120)');
    root.style.setProperty('--body-color', 'rgb(45, 60, 84)');
    root.style.setProperty('--font-family', 'Calibri');
    root.style.setProperty('--line-color', 'rgba(255, 255, 255, 0.12)');
    // document.getElementById("essay").classList.remove("lines")
  } else {
    root.style.setProperty('--text-color', 'black');
    root.style.setProperty('--background-color', '#fafafa');
    root.style.setProperty('--header-color', 'white');
    root.style.setProperty('--body-color', 'rgb(82, 144, 199)');
    root.style.setProperty('--font-family', '"Patrick Hand", cursive');
    root.style.setProperty('--line-color', 'rgba(0, 0, 0, 0.12)');
    // document.getElementById("essay").classList.add("lines")
  }
}

window.addEventListener("resize", shiftMain);
let main = document.getElementById("main");
main.style.top = `${document.getElementById("bg").offsetHeight - 1}px`;

function shiftMain() {
  main.style.top = `${document.getElementById("bg").offsetHeight - 1}px`;
}

</script>
